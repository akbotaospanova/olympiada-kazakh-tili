<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Олимпиадаға дайындық: қазақ тілі мен әдебиеті, 5–8 сынып</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#1f2a37; --muted:#5b6675; --line:#e4ded2;
  --brand:#0f6e6e; --brand-2:#e2f1ef; --accent:#d98b2b; --accent-2:#fbefdc;
  --ok:#2e8b57; --ok-bg:#e5f4ea; --bad:#c2413b; --bad-bg:#fbe8e6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px}
header{background:var(--brand);color:#fff;padding:22px 18px 18px}
header .wrap{max-width:860px;margin:0 auto}
header small{opacity:.85;letter-spacing:.04em;text-transform:uppercase;font-size:12px;font-weight:700}
header h1{margin:4px 0 2px;font-size:24px;font-weight:800;line-height:1.25}
header p{margin:0;opacity:.9;font-size:14px}
nav{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{max-width:860px;margin:0 auto;display:flex;gap:6px;padding:8px 12px;overflow-x:auto}
nav button{flex:1;min-width:max-content;border:0;background:transparent;padding:10px 14px;border-radius:10px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
nav button.active{background:var(--brand);color:#fff}
main{max-width:860px;margin:0 auto;padding:18px 14px 60px}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h2{font-size:20px;margin:0 0 10px;font-weight:800}
h3{font-size:17px;margin:0 0 8px;font-weight:800}
.muted{color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--brand-2);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--brand)}
.stat span{font-size:13px;color:var(--muted)}
ul.clean{padding-left:20px;margin:8px 0}
ul.clean li{margin:4px 0}
.note{background:var(--accent-2);border-left:4px solid var(--accent);padding:10px 12px;border-radius:8px;font-size:14px;margin-top:10px}
details{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden}
details summary{cursor:pointer;padding:14px 16px;font-weight:800;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:20px;color:var(--brand)}
details[open] summary::after{content:"–"}
details .body{padding:0 16px 14px}
.rule{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.rule:first-child{border-top:0;margin-top:0;padding-top:0}
.rule h4{margin:0 0 4px;font-size:15px;color:var(--brand)}
.ex{background:#f3f6f6;border-radius:8px;padding:6px 10px;margin-top:6px;font-size:14px}
.tags{font-size:12px;color:var(--muted);margin-top:6px}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.t td,table.t th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:#f3f6f6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--brand);color:#fff}
.btn.sec{background:#fff;color:var(--brand);border:2px solid var(--brand)}
.btn.warn{background:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.progress{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--accent-2);color:#8a520f}
.qtext{font-size:18px;font-weight:700;margin:10px 0 12px}
.passage{background:#fbf8f1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:12px;max-height:260px;overflow:auto}
.passage p{margin:0 0 8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit;width:100%}
.opt .L{flex:none;width:28px;height:28px;border-radius:8px;background:#eef1f1;display:flex;align-items:center;justify-content:center;font-weight:800}
.opt.sel{border-color:var(--brand);background:var(--brand-2)}
.opt.sel .L{background:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .L{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}
.dots button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:0}
.dots button.done{background:var(--brand-2);border-color:var(--brand);color:var(--brand)}
.dots button.cur{outline:2px solid var(--accent);outline-offset:1px}
.dots button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.dots button.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.explain{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:15px}
.explain.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.explain.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.explain .rl{margin-top:8px;font-size:14px;background:#fff;border-radius:8px;padding:8px 10px}
.score-big{font-size:44px;font-weight:800;color:var(--brand);line-height:1}
.review-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.review-item.ok{border-left:5px solid var(--ok)}
.review-item.no{border-left:5px solid var(--bad)}
.review-item .h{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.ans{font-size:14px;margin-top:6px}
.ans b.g{color:var(--ok)} .ans b.r{color:var(--bad)}
.timer{font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(15,30,40,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.filter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.filter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (max-width:560px){
  header h1{font-size:20px}
  .grid3{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .stat b{font-size:18px}
  .qtext{font-size:17px}
  .dots{grid-template-columns:repeat(6,1fr)}
}
</style>
<style>
.gradebar{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.gradebar button{border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-family:inherit;font-weight:800;cursor:pointer}
.gradebar button.on{background:#fff;color:var(--brand);border-color:#fff}
.gcards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.gcard{border:2px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;background:#fff;cursor:pointer;font:inherit}
.gcard b{display:block;font-size:26px;color:var(--brand)}
.gcard span{font-size:13px;color:var(--muted)}
.gcard.on{border-color:var(--brand);background:var(--brand-2)}
.gcard small{display:block;font-size:12px;margin-top:4px;color:var(--ok);font-weight:700}
@media (max-width:560px){.gcards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="wrap">
  <small>Республикалық олимпиада · 1-кезең (мектепшілік)</small>
  <h1>Қазақ тілі мен әдебиеті · <span id="hGrade">5-сынып</span></h1>
  <p>Ережелерді оқы → тестті орында → қатеңмен жұмыс жаса</p>
  <div class="gradebar" id="gradebar"></div>
</div></header>

<nav><div class="wrap">
  <button data-v="rules" class="active">📘 Ережелер</button>
  <button data-v="test">✏️ Тест</button>
  <button data-v="result">📊 Нәтиже</button>
  <button data-v="fix">🔁 Қатемен жұмыс</button>
</div></nav>

<main>
<section id="v-rules" class="view active">
  <div class="card" id="rulesHead"></div>
  <h2 style="margin:20px 4px 10px">Тестке қажет ережелер</h2>
  <div id="rulesList"></div>
</section>
<section id="v-test" class="view"><div class="card" id="testCard"></div></section>
<section id="v-result" class="view"><div id="resultBox"></div></section>
<section id="v-fix" class="view"><div id="fixBox"></div></section>
</main>

<div class="modal" id="modal"><div class="box">
  <h3 id="mTitle"></h3><p id="mText" class="muted"></p>
  <div class="row" style="justify-content:flex-end"><button class="btn sec" id="mNo">Жоқ</button><button class="btn" id="mYes">Иә</button></div>
</div></div>

<script>
const GRADES = {};
GRADES[5] = {
 title:'5-сынып', passageTitle:'«Бата» мәтіні',
 RULES:[
 {id:'soz', title:'Күрделі сөздер (біріккен, қос, қысқарған, тіркескен)', items:[
  {h:'Күрделі сөз', t:'Екі не одан да көп түбірден құралып, бір ұғымды білдіретін сөз. Төрт түрі бар: <b>біріккен</b>, <b>қос</b>, <b>қысқарған</b>, <b>тіркескен</b> сөздер.'},
  {h:'Біріккен сөз', id:'birik', t:'Екі не үш түбір бірігіп, <b>бірге жазылады</b> және жаңа бір мағына береді. Өсімдік, жануар, жер-су атаулары, салт-дәстүр атаулары көбіне бірге жазылады.', ex:'Аққайың, бозторғай, Шымбұлақ, тілашар, тұсаукесер, тоқымқағар, ақсақал. Үш түбірден: Алты+қара+су = Алтықарасу.'},
  {h:'Қос сөз', t:'Екі сөз қосарланып, <b>сызықша (дефис)</b> арқылы жазылады.', ex:'Жиын-той, тілек-бата, ата-ана, үлкен-кіші.'},
  {h:'Қысқарған сөз', t:'Күрделі атаудың бас әріптерінен немесе буындарынан құралады.', ex:'ҚазҰУ / КазМҰУ, ҚР, БҰҰ.'},
  {h:'Тіркескен сөз', t:'Бір ұғымды білдіретін, бірақ <b>бөлек жазылатын</b> сөздер.', ex:'Ақ киімді, қара қарға (құс атауы), темір жол.'},
  {h:'Есте сақта', t:'«Жылы су», «сабақ кестесі», «үй жиһазы» — бұлар жай <b>сөз тіркестері</b>, бөлек жазылады. Дефис арқылы жазылса — қос сөз, бірге жазылса — біріккен сөз.'}
 ]},
 {id:'buyn', title:'Буын, буын түрлері, буын үндестігі', items:[
  {h:'Буын', t:'Сөздің бір дауыстымен айтылатын бөлігі. Сөзде қанша дауысты болса, сонша буын болады.', ex:'Боз-тор-ғай → 3 дауысты (о, о, а) → 3 буын.'},
  {h:'Буын түрлері', id:'buynturi', t:'<table class="t"><tr><th>Түрі</th><th>Ережесі</th><th>Мысал</th></tr><tr><td>Ашық</td><td>Дауысты дыбысқа аяқталады (немесе тек бір дауыстыдан тұрады)</td><td>а-та, ба-ла, ға</td></tr><tr><td>Тұйық</td><td>Дауыстыдан басталып, дауыссызға аяқталады</td><td>ат, ал, ер</td></tr><tr><td>Бітеу</td><td>Дауыссыздан басталып, дауыссызға аяқталады</td><td>боз, тор, ғай, тас</td></tr></table>', ex:'«Бозторғай»: боз-тор-ғай — үш буынның үшеуі де бітеу (й — дауыссыз).'},
  {h:'Жуан және жіңішке буын', id:'juan', t:'<b>Жуан дауыстылар:</b> а, о, ұ, ы. <b>Жіңішке дауыстылар:</b> ә, ө, ү, і, е. Сөздегі буындардың бәрі жуан болса — бірыңғай жуан, бәрі жіңішке болса — бірыңғай жіңішке.', ex:'Қа-ра-па-йым-ды-лық — бәрі жуан. Із-ет-ті-лік — бәрі жіңішке.'},
  {h:'Буын үндестігі (сингармонизм)', id:'undes', t:'Қазақ сөзінде бірінші буын жуан болса, кейінгі буындар да жуан; жіңішке болса — жіңішке болып келеді. Түбір жуан болса, жалғау-жұрнақ та жуан жалғанады. Бұл заң бұзылған сөз — <b>үндестік сақталмаған</b> сөз.', ex:'Адам (жуан) + гершілік (жіңішке) → «адамгершілік» — үндестік сақталмаған.'}
 ]},
 {id:'leks', title:'Сөздің мағынасы: тура, ауыспалы, синоним, антоним, тұрақты тіркес', items:[
  {h:'Тура және ауыспалы мағына', id:'tura', t:'<b>Тура мағына</b> — сөздің негізгі, алғашқы мағынасы. <b>Ауыспалы мағына</b> — басқа затқа, құбылысқа ауысқан мағына.', ex:'Әуеге ұшу (құс, ұшақ ұшады) — тура. Зәресі ұшу, үрейі ұшу (қорқу) — ауыспалы.'},
  {h:'Синонимдер', id:'sinon', t:'Дыбысталуы әртүрлі, мағынасы жақын сөздер. Синоним қатары <b>бір сөз табынан</b> болады.', ex:'Зат есім: жүз – дидар – келбет. Сын есім: мұңды – қайғылы – қасіретті.'},
  {h:'Антонимдер', id:'anton', t:'Мағынасы бір-біріне қарама-қарсы сөздер.', ex:'Әдемі ↔ көріксіз; ыстық ↔ суық.'},
  {h:'Тұрақты тіркес (фразеологизм)', t:'Сөздері бөлінбейтін, бір тұтас мағына беретін тіркес.', ex:'«Үріп ауызға салғандай» = өте сұлу, әдемі. «Зәресі ұшу» = қатты қорқу.'}
 ]},
 {id:'zat', title:'Зат есім', items:[
  {h:'Жалқы және жалпы есім', id:'jalky', t:'<b>Жалқы есім</b> — адамның, жердің, жануардың жеке аты; бас әріппен жазылады. <b>Жалпы есім</b> — біркелкі заттардың ортақ атауы.', ex:'Жалқы: Абылай, Алматы, Тайбурыл. Жалпы: боран, ертегі, балалар.'},
  {h:'Деректі және дерексіз зат есім', id:'derek', t:'<b>Деректі</b> — көзбен көріп, қолмен ұстауға болатын заттар. <b>Дерексіз</b> — көзге көрінбейтін, сезім, ой, ұғым атаулары.', ex:'Деректі: алтын, кітап, қобыз, домбыра. Дерексіз: қуаныш, бақыт, ой, арман.'}
 ]},
 {id:'syn', title:'Сын есім', items:[
  {h:'Сапалық және қатыстық сын есім', id:'katys', t:'<b>Сапалық</b> — заттың түсін, көлемін, дәмін, сапасын тікелей білдіреді (көбі негізгі түбір). <b>Қатыстық</b> — басқа сөзге жұрнақ (-лы/-лі, -ды/-ді, -ты/-ті, -сыз, -дай т.б.) жалғану арқылы жасалып, бір затқа қатысын білдіреді.', ex:'Сапалық: қызыл, аласа, тәтті. Қатыстық: бақыт+ты = бақытты, төзім+ді = төзімді.'},
  {h:'Негізгі және туынды сын есім', id:'tuyndy', t:'<b>Негізгі</b> — түбір күйінде (үлкен, тәтті). <b>Туынды</b> — жұрнақ арқылы жасалады. Туынды сын есім <b>есім сөзден</b> (зат есімнен) немесе <b>етістіктен</b> жасалуы мүмкін.', ex:'Есімнен: адам+дық, төзім+ді, тас+тай. Етістіктен: жаз+ғыш, көш+пелі, бас+ыңқы.'},
  {h:'Дара және күрделі сын есім', id:'kurdeli', t:'<b>Дара</b> — бір сөзден тұрады. <b>Күрделі</b> — екі не одан көп сөзден тұрады.', ex:'Дара: тәтті, үлкен, тастай. Күрделі: ақ киімді, қара көзді, ұзын бойлы.'},
  {h:'Шырайлар', id:'shyrai', t:'<table class="t"><tr><th>Шырай</th><th>Жасалуы</th><th>Мысал</th></tr><tr><td>Жай</td><td>Түбір күйі</td><td>ұзын, әдемі</td></tr><tr><td>Салыстырмалы</td><td>-рақ/-рек, -ырақ/-ірек, -лау/-леу, -дау/-деу</td><td>ұзынырақ, жақсырақ</td></tr><tr><td>Күшейтпелі</td><td>Буын қосарлау: қып-қызыл</td><td>қып-қызыл, ап-ақ</td></tr><tr><td>Асырмалы</td><td>өте, тым, аса, ең + сын есім</td><td>өте ұзақ, ең биік</td></tr></table>'}

 PASSAGE:`<p><b>Мәтін.</b> Қазақ отбасындағы өте ертеден келе жатқан ерекше дәстүрдің бірі – бата беру. Бата – тілі көркем, ізгі тілек түрінде айтылатын қысқа әрі мәні терең сөз. Батаның тәрбиелік маңызы үлкен. Бата берудің өз жолы, дәстүрі, рәсімдері бар. Дастарқан басында, түрлі жиын-тойда, отбасы мерекелерінде: тұсаукесер, тілашар кезінде жастар қол жайып, үлкендерден бата сұрайды. Батаны кез келген адам бере бермейді. Батаны көпті көрген ақсақалдар мен дана әжелер береді.</p><p>Батаның түрлері бар. Ас батасы – асты үстелге әкелгенде немесе ас ішіп болған соң берілетін бата. Ас батасы тамақ ішкен сайын беріледі. Рамазан батасы – үш күнгі ораза айтта айтылатын ізгі тілек, жақсы ниет. Жол батасы ұзақ жолға шыққанда беріледі. Жолға шығарда үй иесі көршілерге, туыстарға тамақ беріп, үлкен ақсақалдан бата алады. Тілек-бата – үлкендер жастарға риза болғанда, реті келген жерде қолын жайып беретін батаның түрі.</p><p>Қазақтар сөз өнерін өте жоғары бағалаған. «Бата адамға күш береді, жолын ашады, жаман күштерден сақтайды» деп сенген.</p>`,

 PASSAGE:`<p><b>Мәтін.</b> Достық – адамдардың бір-біріне адал, қалтқысыз сеніп, бір мүдделі, ортақ көзқараста болатын қасиеті. Достық өзара жауапкершілік пен қамқорлықтың, рухани жақындықтың белгісі. Нағыз достық кісіге шабыт беріп, өмірде кездесетін түрлі сәтсіздіктерге мойымауға, басқа түскен қайғы мен қиыншылықты бірге көтеруге жәрдемдеседі. Дос-жарандардың мінездері әр түрлі болып келуі мүмкін. Мысалы, біреуінде қызбалық не шабандық, екіншісінде тұйықтық не жігерсіздік байқалса да, бұлар достыққа кедергі бола алмайды, қайта нағыз достық осындай кемшіліктерден арылуға көмектеседі. Сатқындық, екі жүзділік, өтірікшілік, өзімшілдік достықпен сыйыспайды.</p><p>Қазақтың дәстүрлі әдеп жүйесінде достыққа үлкен көңіл бөлінеді. Халық арасында достық туралы мақал-мәтелдер жеткілікті: «Дос жылатып, дұшпан күлдіріп айтады», «Досы жақсының, өзі де жақсы», «Дүниеде адамның жалғыз қалғаны — өлгені, қайғының бәрі соның басында». Достыққа қарама-қарсы ұғым — қастық пен күншілдік. Мұндай сезімге ерік алдырғандар басқаның қуаныш-қызығын, ырыс-бағын көтере алмайды, дос дегеннің не екендігін білмейді. Дұрыс дос таңдай білу — өмірлік мақсаттардың бірі.</p><p>Қазір бізге достық бұрынғыдан бетер қажет. Достық – бұл өмірдегі ешнәрсемен бағаланбайтын құндылық. Дос табу оңай, ал оны сақтау одан да қиын. Достық қатынасқа нәзіктікпен қарап, берік сақтау керек. Өйткені ол да баптауды қажет ететін нәзік өсімдік сияқты. Біздер достықты сақтау үшін жан-тәнімізбен еңбектенбеуіміз керек. Қайтарымын қажет етпей, берудің жолдарын үйрену керек. Сенім мен жарқын көңіл – достықты берік ететін тірек саналады. Өзі шынайы дос бола білген адамның достары да көп болады және жер бетінде өзін жалғыз сезінбейді.</p>`,

  e:'Төлен Әбдіктің «Қонақтар» әңгімесі. Басты кейіпкері — Ерғабыл қарт.'}

const L = ['A','B','C','D','E'];
const pts = i => i<15?1:(i<25?2:3);
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* әр сыныптың өз күйі */
const STATE = {};
for (const g in GRADES) STATE[g] = {answers:GRADES[g].Q.map(()=>[]), cur:0, startT:null, finished:false, results:null, fixList:[], fixIdx:0, fixState:{}, filter:'all'};
let grade = String(store.get('olymp_grade')||5); if(!GRADES[grade]) grade='5';
let timerId = null, curView = 'rules';
const G = () => GRADES[grade], S = () => STATE[grade], Q = () => G().Q;
const isMulti = (i) => { const q=Q()[i]; return !q.any && (q.a.length>1 || (i>=15 && i<25)); };
const ansText = q => q.a.map(j=>L[j]+') '+q.o[j]).join(q.any?' немесе ':'; ');
function isCorrect(q, sel){
  if(!sel.length) return false;
  if(q.any) return sel.length===1 && q.a.includes(sel[0]);
  const c=[...q.a].sort(); return sel.length===c.length && sel.every((x,k)=>x===c[k]);
}

/* ---------- сынып ауыстыру ---------- */
function renderGradebar(){
  document.getElementById('gradebar').innerHTML = Object.keys(GRADES).map(g=>`<button class="${g===grade?'on':''}" onclick="setGrade('${g}')">${g}-сынып</button>`).join('');
  document.getElementById('hGrade').textContent = G().title;
}
function setGrade(g){
  grade=String(g); store.set('olymp_grade',grade);
  clearInterval(timerId); if(S().startT && !S().finished) timerId=setInterval(tick,1000);
  renderGradebar(); renderRules(); go(curView==='test'&&!S().startT?'rules':curView);
}

/* ---------- навигация ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function go(v){
  curView=v;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('active',s.id==='v-'+v));
  if(v==='test'){ if(!S().startT && !S().finished) startTest(); renderTest(); }
  if(v==='result') renderResult();
  if(v==='fix') renderFix();
  window.scrollTo({top:0,behavior:'smooth'});
}
function ask(title,text,yes){
  const m=document.getElementById('modal');
  document.getElementById('mTitle').textContent=title; document.getElementById('mText').textContent=text;
  m.classList.add('show');
  document.getElementById('mYes').onclick=()=>{m.classList.remove('show');yes()};
  document.getElementById('mNo').onclick=()=>m.classList.remove('show');
}

/* ---------- ережелер ---------- */
let ruleIndex = {};
function renderRules(){
  const g=G(), hist=store.get('olymp_hist_'+grade)||[];
  const last = g2 => { const h=store.get('olymp_hist_'+g2)||[]; return h.length?`<small>соңғы: ${h[h.length-1].score}/50</small>`:''; };
  document.getElementById('rulesHead').innerHTML = `
    <h2>Сыныпты таңда</h2>
    <div class="gcards">${Object.keys(GRADES).map(k=>`<button class="gcard ${k===grade?'on':''}" onclick="setGrade('${k}')"><b>${k}</b><span>сынып</span>${last(k)}</button>`).join('')}</div>
    <h2 style="margin-top:18px">Олимпиаданың шарты · ${g.title}</h2>
    <p>Тест <b>30 тапсырмадан</b> тұрады және үш бөлімге бөлінген. Қиындығы артқан сайын ұпайы да көбейеді.</p>
    <div class="grid3">
      <div class="stat"><b>1–15</b><span>әрқайсысы 1 ұпай</span></div>
      <div class="stat"><b>16–25</b><span>әрқайсысы 2 ұпай</span></div>
      <div class="stat"><b>26–30</b><span>әрқайсысы 3 ұпай</span></div>
    </div>
    <p><b>Ең жоғары ұпай: 50</b> (15 + 20 + 15).</p>
    <ul class="clean">
      <li><b>1–15</b> және <b>26–30</b> — бір дұрыс жауапты таңда.</li>
      <li><b>16–25</b> — <b>бір немесе бірнеше</b> дұрыс жауап болуы мүмкін. Ұпай барлық дұрыс жауапты белгілеп, артығын белгілемегенде ғана беріледі.</li>
      ${g.PASSAGE?`<li><b>26–30</b> — алдымен ${g.passageTitle}н мұқият оқы, сұрақтар соған негізделген.</li>`:''}
      <li>Ұсынылатын уақыт — <b>60 минут</b>. Таймер тек өзіңді бақылау үшін, уақыт біткенде тест тоқтамайды.</li>
      <li>Тест біткен соң «Нәтиже» бөлімінде әр сұрақтың дұрыс жауабы мен түсіндірмесін көресің, ал «Қатемен жұмыс» бөлімінде қателескен сұрақтарды қайта орындайсың.</li>
    </ul>
    <div class="note">💡 Кеңес: жауап бермес бұрын төмендегі ережелерді оқып шық. Әр тапсырманың түсіндірмесінде қай ережеге сүйенетіні көрсетілген.</div>
    <div class="row" style="margin-top:14px"><button class="btn" onclick="go('test')">${g.title}: тестті бастау →</button></div>`;
  ruleIndex={};
  document.getElementById('rulesList').innerHTML = g.RULES.map(gr=>{
    const nums = g.Q.map((q,i)=>gr.items.some(it=>it.id===q.r)?i+1:null).filter(Boolean);
    return `<details id="g-${gr.id}"><summary>${gr.title}</summary><div class="body">`+
     gr.items.map(it=>{ if(it.id) ruleIndex[it.id]={g:gr.id,h:it.h,t:it.t,ex:it.ex};
       return `<div class="rule"><h4>${it.h}</h4><div>${it.t}</div>${it.ex?`<div class="ex">Мысал: ${it.ex}</div>`:''}</div>`}).join('')+
     (nums.length?`<div class="tags">Тесттегі тапсырмалар: № ${nums.join(', ')}</div>`:'')+`</div></details>`;
  }).join('');
}
function ruleBlock(id){
  const r=ruleIndex[id]; if(!r) return '';
  return `<div class="rl">📘 <b>Ереже: ${r.h}.</b> ${r.t.replace(/<table[\s\S]*<\/table>/,'(кестесін «Ережелер» бөлімінен қара)')} ${r.ex?'<br><i>Мысал: '+r.ex+'</i>':''}
  <br><a href="#" onclick="openRule('${r.g}');return false">Ережені толық оқу →</a></div>`;
}
function openRule(g){ go('rules'); const d=document.getElementById('g-'+g); d.open=true; setTimeout(()=>d.scrollIntoView({behavior:'smooth',block:'start'}),50); }

/* ---------- тест ---------- */
function startTest(){
  const s=S(); s.answers=Q().map(()=>[]); s.cur=0; s.finished=false; s.results=null; s.startT=Date.now();
  clearInterval(timerId); timerId=setInterval(tick,1000);
}
function tick(){ const el=document.getElementById('timer'); if(el&&S().startT) el.textContent=fmt(Date.now()-S().startT); }
function fmt(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function sectionLabel(i){ return i<15?'1-бөлім · 1 ұпай':(i<25?'2-бөлім · 2 ұпай':'3-бөлім · 3 ұпай'); }
function hintFor(i){ const q=Q()[i]; return isMulti(i)?'☑️ Бір немесе бірнеше дұрыс жауап болуы мүмкін':''; }

function renderTest(){
  const c=document.getElementById('testCard'), s=S();
  if(s.finished){
    c.innerHTML=`<h2>${G().title}: тест аяқталды ✅</h2><p class="muted">Нәтижеңді көр немесе тестті басынан бастап қайта тапсыр.</p>
    <div class="row"><button class="btn" onclick="go('result')">Нәтижені көру</button><button class="btn sec" onclick="restart()">Қайта тапсыру</button></div>`;
    return;
  }
  const i=s.cur, q=Q()[i], done=s.answers.filter(a=>a.length).length;
  c.innerHTML=`
   <div class="spread"><span class="badge">${G().title} · ${sectionLabel(i)}</span><span>⏱ <span class="timer" id="timer">${fmt(Date.now()-s.startT)}</span></span></div>
   <div class="progress"><i style="width:${done/30*100}%"></i></div>
   ${q.p?`<div class="passage">${G().PASSAGE}</div>`:''}
   <div class="muted" style="font-weight:700">${i+1}-тапсырма / 30</div>
   <div class="qtext">${q.q}</div>
   ${hintFor(i)?`<div class="hint" style="margin:-4px 0 10px">${hintFor(i)}</div>`:''}
   <div class="opts">${q.o.map((t,j)=>`<button class="opt ${s.answers[i].includes(j)?'sel':''}" onclick="pick(${j})"><span class="L">${L[j]}</span><span>${t}</span></button>`).join('')}</div>
   <div class="spread" style="margin-top:16px">
     <button class="btn sec" ${i===0?'disabled':''} onclick="move(-1)">← Алдыңғы</button>
     ${i<29?`<button class="btn" onclick="move(1)">Келесі →</button>`:`<button class="btn warn" onclick="finish()">Аяқтау ✓</button>`}
   </div>
   <div class="dots">${Q().map((_,k)=>`<button class="${s.answers[k].length?'done':''} ${k===i?'cur':''}" onclick="jump(${k})">${k+1}</button>`).join('')}</div>
   <div class="row" style="margin-top:14px;justify-content:space-between"><span class="hint">Жауап берілді: ${done} / 30</span><button class="btn warn" onclick="finish()">Тестті аяқтау</button></div>`;
}
function pick(j){
  const s=S(), a=s.answers[s.cur];
  if(isMulti(s.cur)){ const k=a.indexOf(j); k>=0?a.splice(k,1):a.push(j); a.sort(); } else s.answers[s.cur]=[j];
  renderTest();
}
function move(d){ const s=S(); s.cur=Math.max(0,Math.min(29,s.cur+d)); renderTest(); window.scrollTo({top:0}); }
function jump(i){ S().cur=i; renderTest(); }
function finish(){
  const s=S(), empty=s.answers.filter(a=>!a.length).length;
  const doIt=()=>{
    clearInterval(timerId); s.finished=true;
    const time=Date.now()-s.startT;
    const per=Q().map((q,i)=>({ok:isCorrect(q,s.answers[i]), your:[...s.answers[i]]}));
    const score=per.reduce((t,p,i)=>t+(p.ok?pts(i):0),0);
    s.results={per,score,time};
    const hist=store.get('olymp_hist_'+grade)||[]; hist.push({score,time}); store.set('olymp_hist_'+grade,hist.slice(-10));
    s.fixList=per.map((p,i)=>p.ok?null:i).filter(x=>x!==null); s.fixIdx=0; s.fixState={};
    go('result');
  };
  if(empty) ask('Тестті аяқтайсың ба?',`${empty} тапсырмаға жауап берілмеді. Олар қате деп есептеледі.`,doIt); else doIt();
}
function restart(){ const s=S(); s.startT=null; s.finished=false; s.results=null; startTest(); go('test'); }

/* ---------- нәтиже ---------- */
function setFilter(f){ S().filter=f; renderResult(); }
function renderResult(){
  const box=document.getElementById('resultBox'), s=S();
  if(!s.results){ box.innerHTML=`<div class="card"><h2>${G().title}: нәтиже әлі жоқ</h2><p class="muted">Алдымен тестті орындап шық.</p><button class="btn" onclick="go('test')">Тестке өту →</button></div>`; return; }
  const {per,score,time}=s.results, f=s.filter;
  const sec=[[0,15],[15,25],[25,30]].map(([a,b])=>{let x=0,m=0,ok=0;for(let i=a;i<b;i++){m+=pts(i);if(per[i].ok){x+=pts(i);ok++}}return {x,m,ok,n:b-a}});
  const pct=Math.round(score/50*100);
  const msg=pct>=85?'Керемет! Олимпиадаға дайынсың 🏆':pct>=65?'Жақсы нәтиже! Қателеріңді түзетсең, одан да жоғары болады 💪':pct>=40?'Орташа. Ережелерді қайталап, қатемен жұмыс жаса 📘':'Ережелерді мұқият оқып, қайта тапсырып көр 🌱';
  const wrong=per.filter(p=>!p.ok).length, hist=store.get('olymp_hist_'+grade)||[];
  box.innerHTML=`
  <div class="card">
    <div class="spread"><div><div class="muted" style="font-weight:700">${G().title} · жалпы ұпай</div><div class="score-big">${score} <span style="font-size:22px;color:var(--muted)">/ 50</span></div></div>
    <div style="text-align:right"><div class="muted">Уақыт: <b>${fmt(time)}</b></div><div class="muted">Дұрыс: <b>${30-wrong}</b> / 30</div></div></div>
    <div class="progress" style="margin-top:12px"><i style="width:${pct}%"></i></div>
    <p style="margin:6px 0 0;font-weight:700">${msg}</p>
    <div class="grid3">${sec.map((t,k)=>`<div class="stat"><b>${t.x}/${t.m}</b><span>${k+1}-бөлім · ${t.ok}/${t.n} дұрыс</span></div>`).join('')}</div>
    <div class="row">${wrong?`<button class="btn warn" onclick="go('fix')">🔁 Қатемен жұмыс (${wrong})</button>`:''}<button class="btn sec" onclick="restart()">Қайта тапсыру</button></div>
    ${hist.length>1?`<div class="hint" style="margin-top:10px">Соңғы талпыныстар: ${hist.slice(-5).map(h=>h.score).join(' → ')} ұпай</div>`:''}
  </div>
  <div class="card">
    <h3>Жауаптарды тексеру</h3>
    <div class="dots" style="margin:6px 0 12px">${per.map((p,i)=>`<button class="${p.ok?'ok':'no'}" onclick="setFilter('all');setTimeout(()=>document.getElementById('ri${i}').scrollIntoView({behavior:'smooth',block:'center'}),30)">${i+1}</button>`).join('')}</div>
    <div class="filter"><button class="${f==='all'?'on':''}" onclick="setFilter('all')">Барлығы</button><button class="${f==='no'?'on':''}" onclick="setFilter('no')">Қателер</button><button class="${f==='ok'?'on':''}" onclick="setFilter('ok')">Дұрыстар</button></div>
    ${per.map((p,i)=>{
      if(f==='no'&&p.ok||f==='ok'&&!p.ok) return '';
      const q=Q()[i]; const yours=p.your.length?p.your.map(j=>L[j]+') '+q.o[j]).join('; '):'жауап берілмеген';
      return `<div class="review-item ${p.ok?'ok':'no'}" id="ri${i}">
        <div class="h"><span>${i+1}. ${q.q}</span><span>${p.ok?'✅ +'+pts(i):'❌ 0'}</span></div>
        <div class="ans">Сенің жауабың: <b class="${p.ok?'g':'r'}">${yours}</b></div>
        ${p.ok?'':`<div class="ans">Дұрыс жауап: <b class="g">${ansText(q)}</b></div>`}
        <div class="explain ${p.ok?'ok':'bad'}">${q.e}${p.ok?'':ruleBlock(q.r)}</div>
      </div>`}).join('')}
  </div>`;
}

/* ---------- қатемен жұмыс ---------- */
function renderFix(){
  const box=document.getElementById('fixBox'), s=S();
  if(!s.results){ box.innerHTML=`<div class="card"><h2>${G().title}: қатемен жұмыс</h2><p class="muted">Алдымен тестті орындап шық. Сосын осы жерде тек қателескен тапсырмаларды қайта шешесің.</p><button class="btn" onclick="go('test')">Тестке өту →</button></div>`; return; }
  if(!s.fixList.length){
    const all=s.results.per.every(p=>p.ok);
    box.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:48px">🎉</div><h2>${all?'Қате жоқ!':'Барлық қатені түзеттің!'}</h2>
    <p class="muted">${all?'Сен барлық тапсырманы дұрыс орындадың.':'Енді тестті басынан қайта тапсырып, нәтижеңді жақсартып көр.'}</p>
    <div class="row" style="justify-content:center"><button class="btn" onclick="restart()">Тестті қайта тапсыру</button><button class="btn sec" onclick="go('rules')">Ережелерді қайталау</button></div></div>`;
    return;
  }
  if(s.fixIdx>=s.fixList.length) s.fixIdx=0;
  const i=s.fixList[s.fixIdx], q=Q()[i], st=s.fixState[i]||(s.fixState[i]={sel:[],checked:false,ok:false,tries:0});
  box.innerHTML=`<div class="card">
    <div class="spread"><span class="badge">${G().title} · түзетілмеген қате: ${s.fixList.length}</span><span class="muted">${s.fixIdx+1} / ${s.fixList.length}</span></div>
    <div class="note" style="margin:12px 0">Алдымен ережені еске түсір, сосын қайта жауап бер. Дұрыс тапсаң, тапсырма тізімнен шығады.</div>
    ${!st.checked?`<details style="margin-bottom:12px"><summary>📘 Ережені көру (кеңес)</summary><div class="body">${ruleBlock(q.r)}</div></details>`:''}
    ${q.p?`<div class="passage">${G().PASSAGE}</div>`:''}
    <div class="muted" style="font-weight:700">${i+1}-тапсырма · ${pts(i)} ұпай</div>
    <div class="qtext">${q.q}</div>
    ${hintFor(i)?`<div class="hint" style="margin:-4px 0 10px">${hintFor(i)}</div>`:''}
    <div class="hint" style="margin:-4px 0 10px">Бірінші жолғы жауабың: <b style="color:var(--bad)">${s.results.per[i].your.length?s.results.per[i].your.map(j=>L[j]).join(', '):'жоқ'}</b></div>
    <div class="opts">${q.o.map((t,j)=>{
      let cls=st.sel.includes(j)?'sel':'';
      if(st.checked){ if(st.ok&&st.sel.includes(j)) cls='right'; else if(st.sel.includes(j)&&!q.a.includes(j)) cls='wrong'; }
      return `<button class="opt ${cls}" ${st.checked&&st.ok?'disabled':''} onclick="fixPick(${j})"><span class="L">${L[j]}</span><span>${t}</span></button>`}).join('')}</div>
    ${st.checked?(st.ok?`<div class="explain ok">✅ <b>Дұрыс!</b> ${q.e}</div>`:
       `<div class="explain bad">❌ <b>Әлі дұрыс емес.</b> ${st.tries>=2?'Дұрыс жауап: <b>'+ansText(q)+'</b>. '+q.e:'Ережені қайта оқып, тағы бір рет байқап көр.'}${ruleBlock(q.r)}</div>`):''}
    <div class="spread" style="margin-top:16px">
      <button class="btn sec" onclick="fixSkip()">Кейінге қалдыру</button>
      ${st.checked&&st.ok?`<button class="btn" onclick="fixNext()">Келесі қате →</button>`:
        st.checked?`<button class="btn" onclick="fixRetry()">Қайта жауап беру</button>`:
        `<button class="btn" ${st.sel.length?'':'disabled'} onclick="fixCheck()">Тексеру</button>`}
    </div>
  </div>`;
}
function fixPick(j){ const s=S(), i=s.fixList[s.fixIdx], st=s.fixState[i]; if(st.checked) return;
  if(isMulti(i)){ const k=st.sel.indexOf(j); k>=0?st.sel.splice(k,1):st.sel.push(j); st.sel.sort(); } else st.sel=[j];
  renderFix(); }
function fixCheck(){ const s=S(), i=s.fixList[s.fixIdx], st=s.fixState[i]; st.checked=true; st.tries++; st.ok=isCorrect(Q()[i],st.sel); renderFix(); }
function fixRetry(){ const s=S(), st=s.fixState[s.fixList[s.fixIdx]]; st.checked=false; st.sel=[]; renderFix(); }
function fixNext(){ const s=S(); s.fixList.splice(s.fixIdx,1); renderFix(); window.scrollTo({top:0}); }
function fixSkip(){ const s=S(), st=s.fixState[s.fixList[s.fixIdx]]; if(st&&!st.ok){st.checked=false;st.sel=[];} s.fixIdx=(s.fixIdx+1)%s.fixList.length; renderFix(); window.scrollTo({top:0}); }

renderGradebar(); renderRules();
</script>
</body>
</html>
